name: creator-platform-independent
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: creator_platform
      POSTGRES_USER: platform_system
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a database password}
      PLATFORM_API_PASSWORD: ${PLATFORM_API_PASSWORD:?Generate a distinct API database password}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/01-platform.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform_system -d creator_platform"]
      interval: 5s
      retries: 20
  redis:
    image: redis:8.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://platform_api:${PLATFORM_API_PASSWORD}@db:5432/creator_platform
      SYSTEM_DATABASE_URL: postgresql+psycopg://platform_system:${POSTGRES_PASSWORD}@db:5432/creator_platform
      REDIS_URL: redis://redis:6379/0
    command: [sh, -c, "alembic upgrade head && python scripts/seed.py && python scripts/grant_api.py"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://platform_api:${PLATFORM_API_PASSWORD}@db:5432/creator_platform
      SYSTEM_DATABASE_URL: postgresql+psycopg://platform_system:${POSTGRES_PASSWORD}@db:5432/creator_platform
      REDIS_URL: redis://redis:6379/0
    ports: ['127.0.0.1:8000:8000']
    volumes: [receipts:/app/storage]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://platform_api:${PLATFORM_API_PASSWORD}@db:5432/creator_platform
      SYSTEM_DATABASE_URL: postgresql+psycopg://platform_system:${POSTGRES_PASSWORD}@db:5432/creator_platform
      REDIS_URL: redis://redis:6379/0
    command: [python, -m, platform_app.worker]
    volumes: [receipts:/app/storage]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  receipts:
