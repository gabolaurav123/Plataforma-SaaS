name: Platform checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check backend tests
      - run: pytest --cov=platform_app
      - run: python scripts/bootstrap.py
      - run: alembic upgrade head
      - run: alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build:seenode
      - run: npm audit --audit-level=high
  postgres-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --prefix qa
      - run: npm run test:rls --prefix qa
      - run: npm run test:migration --prefix qa
