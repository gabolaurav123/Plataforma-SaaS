name: Platform checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgresql+psycopg://postgres:local-ci-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check backend tests
      - run: pytest --cov=platform_app
      - run: python scripts/bootstrap.py
      - run: alembic upgrade head
      - run: alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build:seenode
      - run: npm audit --audit-level=high
  postgres-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --prefix qa
      - run: npm run test:rls --prefix qa
      - run: npm run test:migration --prefix qa
