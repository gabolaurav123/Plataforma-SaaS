[project]
name = "telegram-creator-platform"
version = "0.3.1"
description = "Central multi-tenant Telegram creator subscription platform"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "redis>=5,<9",
  "cryptography>=44", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20", "Pillow>=12.3,<13"
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["postgres: requires isolated PostgreSQL test databases"]
[tool.ruff]
line-length = 110
target-version = "py313"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
